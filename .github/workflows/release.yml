# The deliverable is a Docker image. A signed tag `v*` builds it, runs the core's tests inside the build
# (the first stage of the Dockerfile), and publishes it to the GitHub container registry under the tag.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/masterlaplace/vesuve:${{ github.ref_name }}
            ghcr.io/masterlaplace/vesuve:latest
