# The prize software: a C core (`core/`, built by `make`) and Python services.
#
# ⚠ The BASE dependencies are those a prize command needs to run; the ink inference (torch, 3.8 GiB with
# CUDA) is a separate group, because three pipelines out of four give their verdict without it and say so.
[project]
name = "vesuve"
version = "0.4.0"
description = "One program, one pipeline per Vesuvius Challenge prize, built on what LplVesuvius validated"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "tifffile>=2024.1",
    "imagecodecs>=2024.1",
    "numcodecs>=0.12,<0.16",
    "pillow>=10.0",
    # scipy: the rotation of the row profiles (`vesuve/render/rows.py`), as in the research.
    "scipy>=1.11",
]

[project.optional-dependencies]
ink = [
    "torch>=2.0",
    "transformers>=4.46,<5",
    "timesformer-pytorch>=0.4",
]
# scipy: for the RESEARCH code the parity tests import as their oracle; the program itself does not import it.
tests = ["pytest>=8", "scipy>=1.11"]

[project.scripts]
vesuve = "vesuve.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vesuve"]
# The library is built by `make`, hence ignored by git: without this line the wheel would ship without its core
# and every command would fail on load.
artifacts = ["vesuve/_core/libvesuve.so"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# The merge gate: a warning is an error, here and not in a CI script.
filterwarnings = [
    "error",
    # ⚠ The ONLY exception, and it targets third-party code: `timesformer_pytorch/__init__.py:1` compares `amt is 0`,
    # which Python 3.12+ flags at compile time. It is not our code, the behaviour is correct for a small integer, and
    # the line goes the day the dependency is fixed or replaced.
    "ignore:\"is\" with 'int' literal:SyntaxWarning",
]
markers = ["network: reads the public bucket (dl.ash2txt.org, S3); skipped without VESUVE_NETWORK=1"]
