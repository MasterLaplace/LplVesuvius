# Le logiciel des prix : un noyau C (`noyau/`, construit par `make`) et des services Python.
#
# ⚠ Les dépendances de BASE sont celles qu'une commande de prix exige pour tourner ; l'inférence
# d'encre (torch, 3,8 Gio avec CUDA) est un groupe à part, parce que trois pipelines sur quatre
# rendent leur verdict sans elle et le disent.
[project]
name = "vesuve"
version = "0.1.0"
description = "One program, one pipeline per Vesuvius Challenge prize, built on what LplVesuvius validated"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "tifffile>=2024.1",
    "imagecodecs>=2024.1",
    "numcodecs>=0.12,<0.16",
    "pillow>=10.0",
    # scipy : la rotation des profils de rangées (`vesuve/rendu/rangees.py`), comme chez le producteur.
    "scipy>=1.11",
]

[project.optional-dependencies]
encre = [
    "torch>=2.0",
    "transformers>=4.46,<5",
    "timesformer-pytorch>=0.4",
]
# scipy : pour le code de RECHERCHE, que les tests de parité importent comme oracle ; le logiciel
# lui-même ne l importe pas.
tests = ["pytest>=8", "scipy>=1.11"]

[project.scripts]
vesuve = "vesuve.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vesuve"]
# La bibliothèque est construite par `make`, donc ignorée par git : sans cette ligne la roue
# partirait sans son noyau et chaque commande échouerait au chargement.
artifacts = ["vesuve/_noyau/libvesuve.so"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# La porte de merge : un avertissement est une erreur, ici et non dans un script de CI.
filterwarnings = ["error"]
markers = ["reseau: lit le bucket public (dl.ash2txt.org, S3) ; sauté sans VESUVE_RESEAU=1"]
