[project]
name = "lplvesuvius-inference-xpu"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch==2.9.1+xpu",
    "pytorch-triton-xpu",
    "transformers>=4.46,<5",
    "numpy>=2.0",
    "tifffile",
    "imagecodecs",
    "timesformer-pytorch",
]

[tool.uv.sources]
torch = { index = "pytorch-xpu" }
pytorch-triton-xpu = { index = "pytorch-xpu" }

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true
