[project]
name = "lplvesuvius-experiments"
version = "0.1.0"
description = "Experiences de mesure sur les traces de surface Vesuvius"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "tifffile>=2025.1.1",
    "zarr>=2.18,<3",
    "s3fs>=2024.6.0",
    "fsspec>=2024.6.0",
    "scipy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/excision"]
